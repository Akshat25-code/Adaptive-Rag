name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check src/ streamlit_app/ tests/
      - name: Ruff format check
        run: ruff format --check src/ streamlit_app/ tests/
      - name: MyPy type check
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly-dummy' }}
        run: |
          pytest tests/ -v --ignore=tests/test_api.py
