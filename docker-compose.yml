services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017

  streamlit:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
    command: streamlit run streamlit_app/home.py --server.port 8501 --server.address 0.0.0.0

volumes:
  mongo_data:
